name: Home Latest 10 Tenders + 10 Corrigenda
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/home_latest.py, backend/checks_cutoff.py, .github/workflows/home-latest.yml]
  schedule:
    # 14-minute cadence before 18:30 IST; delayed starts are runtime guarded.
    # Weekly phase avoids the 4-minute gap caused by */14. GitHub can start late.
    - cron: "3,17,31,45,59 0,7 * * 0"
    - cron: "13,27,41,55 1,8 * * 0"
    - cron: "9,23,37,51 2,9 * * 0"
    - cron: "5,19,33,47 3,10 * * 0"
    - cron: "1,15,29,43,57 4,11 * * 0"
    - cron: "11,25,39,53 5,12 * * 0"
    - cron: "7,21,35,49 6 * * 0"
    - cron: "5,19,33,47 0,7 * * 1"
    - cron: "1,15,29,43,57 1,8 * * 1"
    - cron: "11,25,39,53 2,9 * * 1"
    - cron: "7,21,35,49 3,10 * * 1"
    - cron: "3,17,31,45,59 4,11 * * 1"
    - cron: "13,27,41,55 5,12 * * 1"
    - cron: "9,23,37,51 6 * * 1"
    - cron: "7,21,35,49 0,7 * * 2"
    - cron: "3,17,31,45,59 1,8 * * 2"
    - cron: "13,27,41,55 2,9 * * 2"
    - cron: "9,23,37,51 3,10 * * 2"
    - cron: "5,19,33,47 4,11 * * 2"
    - cron: "1,15,29,43,57 5,12 * * 2"
    - cron: "11,25,39,53 6 * * 2"
    - cron: "9,23,37,51 0,7 * * 3"
    - cron: "5,19,33,47 1,8 * * 3"
    - cron: "1,15,29,43,57 2,9 * * 3"
    - cron: "11,25,39,53 3,10 * * 3"
    - cron: "7,21,35,49 4,11 * * 3"
    - cron: "3,17,31,45,59 5,12 * * 3"
    - cron: "13,27,41,55 6 * * 3"
    - cron: "11,25,39,53 0,7 * * 4"
    - cron: "7,21,35,49 1,8 * * 4"
    - cron: "3,17,31,45,59 2,9 * * 4"
    - cron: "13,27,41,55 3,10 * * 4"
    - cron: "9,23,37,51 4,11 * * 4"
    - cron: "5,19,33,47 5,12 * * 4"
    - cron: "1,15,29,43,57 6 * * 4"
    - cron: "13,27,41,55 0,7 * * 5"
    - cron: "9,23,37,51 1,8 * * 5"
    - cron: "5,19,33,47 2,9 * * 5"
    - cron: "1,15,29,43,57 3,10 * * 5"
    - cron: "11,25,39,53 4,11 * * 5"
    - cron: "7,21,35,49 5,12 * * 5"
    - cron: "3,17,31,45,59 6 * * 5"
    - cron: "1,15,29,43,57 0,7 * * 6"
    - cron: "11,25,39,53 1,8 * * 6"
    - cron: "7,21,35,49 2,9 * * 6"
    - cron: "3,17,31,45,59 3,10 * * 6"
    - cron: "13,27,41,55 4,11 * * 6"
    - cron: "9,23,37,51 5,12 * * 6"
    - cron: "5,19,33,47 6 * * 6"
permissions:
  contents: write
concurrency:
  group: mp-home-latest
  cancel-in-progress: false
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Copy and extract latest Home entries (12-minute budget)
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/checks_cutoff.py backend/home_latest.py
      - name: Publish any remaining checkpoint
        if: always()
        run: python backend/publish_data_checkpoint.py all_tenders_org_detailed.csv data/home_latest_queue.json data/home_latest_status.json
