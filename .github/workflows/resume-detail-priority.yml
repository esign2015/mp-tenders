name: Resume Detail Extraction With Current Priority
on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-detail-priority.yml]
permissions:
  actions: write
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume saved details with three independent search sessions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          def request(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              with urllib.request.urlopen(urllib.request.Request(base+path, data=data, headers=headers, method=method), timeout=30) as response:
                  return json.loads(response.read() or '{}')
          # Stop only the older copy run containing the incorrect row selector.
          # The fixed copy and parallel detail runs are already queued/running.
          run = request('/actions/runs/36697590459')
          if run['head_sha'] == '7101ce710f7ad4a6234ebcea3ae629ba85bf4c36' and run['status'] != 'completed':
              request('/actions/runs/36697590459/force-cancel', 'POST')
          print('Legacy copy stopped; fixed copy and parallel detail extraction retained.')
          PY
