name: Resume Detail Extraction With Current Priority
on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-detail-priority.yml]
permissions:
  actions: write
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume saved details with three independent search sessions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          def request(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              with urllib.request.urlopen(urllib.request.Request(base+path, data=data, headers=headers, method=method), timeout=30) as response:
                  return json.loads(response.read() or '{}')
          # Replace the serial run only; its published checkpoints remain on main.
          run = request('/actions/runs/36690376398')
          if run['head_sha'] == '9536213be5b2fe421106b92879a702c2eeec8e6e' and run['status'] != 'completed':
              request('/actions/runs/36690376398/cancel', 'POST')
          request('/actions/workflows/targeted-pending-retry.yml/dispatches','POST',{'ref':'main','inputs':{'tender_ids':''}})
          print('Parallel deadline-priority extraction queued; saved details preserved.')
          PY
