name: Validate workflow syntax
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-workflow.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          p=Path(".github/workflows/scrape.yml")
          data=yaml.safe_load(p.read_text())
          assert isinstance(data, dict), "workflow is not a mapping"
          assert "jobs" in data and isinstance(data["jobs"], dict) and data["jobs"], "jobs missing"
          print("YAML parse OK; jobs:", list(data["jobs"]))
          PY
