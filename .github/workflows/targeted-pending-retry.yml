name: Targeted Pending Detail Retry

on:
  # Resume unfinished live details even when no new list refresh is requested.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tender_ids:
        description: "Optional comma-separated Tender IDs to prioritise"
        type: string
        default: ""
  push:
    branches: ["main"]
    paths:
      - "backend/targeted_pending_retry.py"
      - "backend/inventory_summary.py"
      - ".github/workflows/targeted-pending-retry.yml"

permissions:
  contents: write

jobs:
  retry_pending:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retry-pending]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-details
      cancel-in-progress: false
    env:
      PRIORITY_TENDER_IDS: ${{ inputs.tender_ids || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium for Home Tender ID search
        run: python -m playwright install --with-deps chromium
      - name: Read explicit priority IDs from this requested retry
        if: github.event_name == 'push'
        env:
          REQUEST_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          python - <<'PY'
          import os, re
          message = os.environ['REQUEST_COMMIT_MESSAGE']
          match = re.search(r'\[tender-ids=([^\]]+)\]', message)
          if match:
              ids = [item.strip() for item in match.group(1).split(',')]
              if not all(re.fullmatch(r'20\d{2}_[A-Za-z0-9]+_\d+_\d+', item) for item in ids):
                  raise ValueError('Invalid requested Tender ID')
              with open(os.environ['GITHUB_ENV'], 'a') as target:
                  target.write('PRIORITY_TENDER_IDS=' + ','.join(ids) + '\n')
          PY
      - name: Resume incomplete live details
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/targeted_pending_retry.py > targeted_pending_retry.log 2>&1 &
          PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            python backend/publish_data_checkpoint.py all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json
            sleep 120
          done
          wait "$PID"
      - name: Publish final detail results without overwriting other workers
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/publish_data_checkpoint.py all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json
      - name: Show retry log
        if: always()
        run: cat targeted_pending_retry.log || true
