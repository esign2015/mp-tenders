name: Targeted Pending Detail Retry

on:
  push:
    branches: ["main"]
    paths:
      - "backend/targeted_pending_retry.py"
      - ".github/workflows/targeted-pending-retry.yml"

permissions:
  contents: write

jobs:
  retry_pending:
    if: contains(github.event.head_commit.message, '[retry-pending]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: mp-targeted-pending-retry
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run targeted Pending retry
        run: |
          set -o pipefail
          python backend/targeted_pending_retry.py | tee targeted_pending_retry.log

      - name: Commit targeted detail results
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete targeted Pending detail retry [skip ci]"
            git push || true
          fi

      - name: Show retry log
        if: always()
        run: cat targeted_pending_retry.log || true
