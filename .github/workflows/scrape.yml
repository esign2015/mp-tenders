name: MP Tender Daily Scraper

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/scrape.yml"
      - "index.html"
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * *"   # 9:15 PM IST — full organisation/tender snapshot (after evening alert)
    - cron: "35 4 * * *"     # 10:05 AM IST — corrigendum check before morning alert
    - cron: "35 10 * * *"    # 4:05 PM IST — 6 hours after morning check
    - cron: "15 15 * * *"    # 8:45 PM IST — final corrigendum check before evening alert
    - cron: "15 21 * * *"    # 2:45 AM IST — 6 hours after evening check
    - cron: "*/5 * * * *"    # 5-minute scheduler: random organisation monitor + urgent corrigendum checks

permissions:
  contents: write

jobs:
  detail_validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate exactly 9 Directorate Sports and Youth Welfare detail pages
        env:
          DETAIL_VALIDATION_ONLY: "1"
          DETAIL_SAMPLE_SIZE: "9"
          DETAIL_ORGANISATION: "Directorate Sports and Youth Welfare"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              git add data/status.json
              git diff --cached --quiet || git commit -m "Update extraction status [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
            sleep 30
          done
          wait "$SCRAPER_PID"
      - name: Commit 9-detail validation data
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv detail_validation.csv
          if git diff --cached --quiet; then
            echo "No 9-detail changes to commit."
          else
            git commit -m "Update 9 Directorate Sports detail validation records"
            git push
          fi

  scrape_full:
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '45 15 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-scrape-details]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install ReportLab for Telegram PDFs
        run: pip install reportlab
      - name: Install Chromium for full scraper
        run: python -m playwright install --with-deps chromium
      - name: Recover existing Render dataset before extraction
        env:
          RENDER_TENDERS_API: "https://mp-tenders-api.onrender.com/api/tenders"
        run: |
          set -e
          echo "Checking Render for a larger previously-successful dataset; existing data is never discarded."
          python - <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path
          url=os.environ["RENDER_TENDERS_API"]
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload=json.loads(response.read().decode("utf-8"))
              rows=payload.get("tenders", payload if isinstance(payload,list) else [])
              if rows:
                  rows=[r for r in rows if isinstance(r,dict) and str(r.get("Tender ID","")).strip()]
                  existing_ids=set()
                  local=Path("all_tenders_org_detailed.csv")
                  if local.exists():
                      with local.open(encoding="utf-8-sig",newline="") as f:
                          existing_ids={str(r.get("Tender ID","")).strip() for r in csv.DictReader(f) if str(r.get("Tender ID","")).strip()}
                  if len(rows) > len(existing_ids):
                      local_rows=[]
                      local=Path("all_tenders_org_detailed.csv")
                      if local.exists():
                          with local.open(encoding="utf-8-sig",newline="") as f:
                              local_rows=list(csv.DictReader(f))
                      by_id={str(r.get("Tender ID","")).strip():dict(r) for r in local_rows if str(r.get("Tender ID","")).strip()}
                      order=list(by_id)
                      for remote in rows:
                          tid=str(remote.get("Tender ID","")).strip()
                          if not tid:
                              continue
                          if tid not in by_id:
                              by_id[tid]=dict(remote)
                              order.append(tid)
                          else:
                              for k,v in dict(remote).items():
                                  if str(v or "").strip():
                                      by_id[tid][k]=v
                      fields=[]
                      for r in list(by_id.values()):
                          for k in r.keys():
                              if k not in fields:
                                  fields.append(k)
                      with local.open("w",encoding="utf-8",newline="") as f:
                          w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
                          w.writeheader()
                          w.writerows([by_id[k] for k in order])
                      print(f"Merged larger Render dataset: remote={len(rows)}, local_before={len(existing_ids)}, final={len(order)}; no Tender ID was deleted.")
                  else:
                      print(f"Render dataset ({len(rows)}) is not larger than local ({len(existing_ids)}); keeping local data.")
              else:
                  print("Render API returned no tender records; keeping CSV untouched.")
          except Exception as exc:
              print(f"Render API recovery unavailable: {exc}")
          PY

      - name: Run MP Tender scraper — full organisation/tender list
        env:
          DETAIL_SAMPLE_SIZE: "0" # [run-scrape-details]
          FETCH_DETAIL_PAGES: "0"
          # Phase 1: collect organisation counts and every tender-list row first.
          # Detail pages are opened only after the complete list snapshot is saved.
          # Incremental mode: do not reopen already-complete tender detail pages.
          FORCE_DETAIL_REFRESH: "0"
          # 0 = process the full remaining dataset; checkpoint every 10 successes.
          # Full recovery run: rebuild the current organisation/tender snapshot first.
          DETAIL_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          LAST_PUBLISHED_CHECKPOINT=0
          LAST_PUBLISHED_ORG_PROGRESS=""

          # Publish list progress as soon as each organisation is collected.
          # Detail checkpoints still publish every 10 successful detail pages.
          # This prevents the dashboard from remaining empty while detail extraction is slow.
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              read -r CHECKPOINT ORG_PROGRESS < <(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path("data/status.json").read_text(encoding="utf-8"))
              print(int(data.get("detail_batch_completed", 0) or 0), data.get("organisation_progress", ""))
          except Exception:
              print(0, "")
          PY
              )

              SHOULD_PUBLISH="false"
              if [ "$CHECKPOINT" -ge 10 ] && [ "$CHECKPOINT" != "$LAST_PUBLISHED_CHECKPOINT" ]; then
                SHOULD_PUBLISH="true"
              fi
              if [ -n "$ORG_PROGRESS" ] && [ "$ORG_PROGRESS" != "$LAST_PUBLISHED_ORG_PROGRESS" ]; then
                SHOULD_PUBLISH="true"
              fi

              if [ "$SHOULD_PUBLISH" = "true" ]; then
                echo "Publishing live checkpoint: org=$ORG_PROGRESS detail=$CHECKPOINT"
                for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
                  if [ -s "$f" ]; then git add "$f"; fi
                done

                if ! git diff --cached --quiet; then
                  git commit -m "Live tender data checkpoint org $ORG_PROGRESS detail $CHECKPOINT [skip ci]"
                  git fetch origin "${GITHUB_REF_NAME}"
                  git rebase "origin/${GITHUB_REF_NAME}" || true
                  git push origin "HEAD:${GITHUB_REF_NAME}" || true
                fi
                LAST_PUBLISHED_CHECKPOINT="$CHECKPOINT"
                LAST_PUBLISHED_ORG_PROGRESS="$ORG_PROGRESS"
              fi
            fi
            sleep 10
          done
          wait "$SCRAPER_PID"

      - name: Phase 2 — extract tender detail pages after full list collection
        env:
          FETCH_DETAIL_PAGES: "1"
          FORCE_DETAIL_REFRESH: "0"
          DETAIL_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_detail_live.log 2>&1 &
          SCRAPER_PID=$!
          LAST_PUBLISHED_CHECKPOINT=0
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              CHECKPOINT="$(python -c 'import json; print(json.load(open("data/status.json")).get("detail_batch_completed",0))' 2>/dev/null || echo 0)"
              if [ "$CHECKPOINT" -ge 10 ] && [ "$CHECKPOINT" != "$LAST_PUBLISHED_CHECKPOINT" ]; then
                for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
                  [ -s "$f" ] && git add "$f"
                done
                if ! git diff --cached --quiet; then
                  git commit -m "Detail checkpoint $CHECKPOINT [skip ci]"
                  git push || true
                fi
                LAST_PUBLISHED_CHECKPOINT="$CHECKPOINT"
              fi
            fi
            sleep 10
          done
          wait "$SCRAPER_PID"
      - name: Commit whatever tender data was collected
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No tender data checkpoint to commit."
          else
            git commit -m "Checkpoint collected tender data"
            git push || echo "Checkpoint commit push failed; retained in workspace/logs."
          fi
  corrigendum_watch:
    if: github.event_name == 'schedule' && (github.event.schedule == '35 4 * * *' || github.event.schedule == '35 10 * * *' || github.event.schedule == '15 15 * * *' || github.event.schedule == '15 21 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check active + pre-opening corrigendums
        env:
          MONITOR_CORRIGENDUM_ONLY: "1"
        run: python backend/scraper.py
      - name: Commit corrigendum/date/cancellation changes
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          if [ -s all_tenders_org_detailed.csv ]; then
            git add all_tenders_org_detailed.csv
          fi
          if git diff --cached --quiet; then
            echo "No corrigendum changes."
          else
            git commit -m "Update scheduled corrigendum watch [skip ci]"
            git push || echo "Corrigendum checkpoint push failed."
          fi

  corrigendum_urgent:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check exact pre-opening 15m/5m window
        env:
          MONITOR_CORRIGENDUM_ONLY: "1"
          CORRIGENDUM_URGENT_ONLY: "1"
        run: python backend/scraper.py
      - name: Commit urgent corrigendum changes
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          [ -s all_tenders_org_detailed.csv ] && git add all_tenders_org_detailed.csv || true
          if git diff --cached --quiet; then
            echo "No urgent corrigendum changes."
          else
            git commit -m "Update pre-opening corrigendum check [skip ci]"
            git push || echo "Urgent corrigendum checkpoint push failed."
          fi

  telegram_scheduler:
    # Single source of truth: data/schedule_config.json.
    # GitHub only ticks every 5 minutes; Python decides the actual alert time.
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mp-telegram-sender
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether a Telegram alert is due
        id: gate
        run: |
          python backend/telegram_scheduler.py | tee /tmp/telegram_schedule.txt
          if grep -q '^run=true$' /tmp/telegram_schedule.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          grep '^mode=' /tmp/telegram_schedule.txt | cut -d= -f2- > /tmp/telegram_mode || true
          grep '^key=' /tmp/telegram_schedule.txt | cut -d= -f2- > /tmp/telegram_key || true
      - name: Install ReportLab
        if: steps.gate.outputs.run == 'true'
        run: pip install reportlab
      - name: Send scheduled Telegram alert
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="$(cat /tmp/telegram_mode)"
          NOTIFY_MODE="$MODE" python backend/telegram_alerts.py
      - name: Mark Telegram alert complete
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mode=Path("/tmp/telegram_mode").read_text(encoding="utf-8").strip()
          key=Path("/tmp/telegram_key").read_text(encoding="utf-8").strip()
          path=Path("data/telegram_schedule.json")
          state={}
          if path.exists():
              try:
                  state=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  state={}
          state[mode]=key
          path.write_text(json.dumps(state, indent=2), encoding="utf-8")
          PY
      - name: Commit Telegram scheduler state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add data/telegram_schedule.json
          git diff --cached --quiet || git commit -m "Record Telegram alert schedule state [skip ci]"
          git push || echo "Telegram schedule state push failed."

  monitor_changes:
    # Random organisation monitor. The Python scheduler chooses irregular
    # check times from 30 minutes before the morning Telegram until 18:58 IST.
    # It is linked to data/schedule_config.json, so changing the Telegram time
    # automatically moves the monitoring window.
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Decide whether a random organisation check is due
        id: gate
        run: |
          python backend/org_monitor_scheduler.py | tee /tmp/org_schedule.txt
          if grep -q '^run=true$' /tmp/org_schedule.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          grep '^key=' /tmp/org_schedule.txt | cut -d= -f2- > /tmp/org_slot_key || true
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Check live Tenders by Organisation
        if: steps.gate.outputs.run == 'true'
        env:
          MONITOR_ONLY: "1"
          ORG_SCHEDULED_MONITOR: "1"
        run: python backend/scraper.py
      - name: Mark random slot complete
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          key=Path("/tmp/org_slot_key").read_text(encoding="utf-8").strip()
          Path("data/org_monitor_schedule.json").write_text(
              json.dumps({"last_executed": key}, indent=2),
              encoding="utf-8"
          )
          PY
      - name: Commit organisation monitor data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv data/status.json data/org_monitor_schedule.json || true
          if git diff --cached --quiet; then
            echo "No organisation monitor changes."
          else
            git commit -m "Random MP organisation tender monitor [skip ci]"
            git push || echo "Organisation monitor push failed."
          fi
