name: MP Tender Daily Scraper

concurrency:
  group: mp-tender-scrape
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/scrape.yml"
  schedule:
    # 19:05 IST (UTC+5:30)
    - cron: "35 13 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Chromium for MP portal
        run: python -m playwright install --with-deps chromium

      - name: Run MP Tender scraper
        run: python backend/scraper.py

      - name: Commit collected organisation and tender-list data
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update MP organisation and tender-list data"
            git push
          fi

