name: MP Tender Daily Scraper

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/scrape.yml"
      - "index.html"
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"   # 8:45 PM IST — data extraction
    - cron: "25 15 * * *"   # 8:55 PM IST — New Published Telegram
    - cron: "30 15 * * *"   # 9:00 PM IST — Total Tenders Telegram
    - cron: "50 4 * * *"    # 10:20 AM IST — Closing Today Telegram
    - cron: "*/5 3-13 * * *"

permissions:
  contents: write

jobs:
  detail_validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate exactly 9 Directorate Sports and Youth Welfare detail pages
        env:
          DETAIL_VALIDATION_ONLY: "1"
          DETAIL_SAMPLE_SIZE: "9"
          DETAIL_ORGANISATION: "Directorate Sports and Youth Welfare"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              git add data/status.json
              git diff --cached --quiet || git commit -m "Update extraction status [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
            sleep 30
          done
          wait "$SCRAPER_PID"
      - name: Commit 9-detail validation data
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv detail_validation.csv
          if git diff --cached --quiet; then
            echo "No 9-detail changes to commit."
          else
            git commit -m "Update 9 Directorate Sports detail validation records"
            git push
          fi

  scrape_full:
    concurrency:
      group: mp-tender-full-scrape
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '15 15 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-scrape-details]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install ReportLab for Telegram PDFs
        run: pip install reportlab
      - name: Install Chromium for full scraper
        run: python -m playwright install --with-deps chromium
      - name: Recover existing Render dataset before extraction
        env:
          RENDER_TENDERS_API: "https://mp-tenders-api.onrender.com/api/tenders"
        run: |
          set -e
          if [ ! -s all_tenders_org_detailed.csv ]; then
            echo "GitHub detailed CSV is empty; attempting one-time recovery from the existing Render API copy."
            python - <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path
          url=os.environ["RENDER_TENDERS_API"]
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload=json.loads(response.read().decode("utf-8"))
              rows=payload.get("tenders", payload if isinstance(payload,list) else [])
              if rows:
                  rows=[r for r in rows if isinstance(r,dict) and str(r.get("Tender ID","")).strip()]
                  if rows:
                      fields=[
                          "Tender ID","Published Date","Closing Date","Opening Date","Title",
                          "Reference Number","Organisation","Department","Division","Sub Division",
                          "PAC Amount","EMD Fee","Tender Fee","Processing Fee","Total Fee",
                          "Location","Pincode","Work Description","Product Category","Sub Category",
                          "Contract Type","Bid Validity","Pre Qualification Details",
                          "Bid Submission Start Date","Bid Submission End Date","Bid Opening Date",
                          "Document Download Start Date","Document Download End Date",
                          "Fee Payable To","Fee Payable At","Status","URL"
                      ]
                      with Path("all_tenders_org_detailed.csv").open("w",encoding="utf-8",newline="") as f:
                          w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
                          w.writeheader()
                          w.writerows(rows)
                      print(f"Recovered {len(rows)} existing tender records from Render API.")
                  else:
                      print("Render API returned no usable tender records; keeping CSV untouched.")
              else:
                  print("Render API returned no tender records; keeping CSV untouched.")
          except Exception as exc:
              print(f"Render API recovery unavailable: {exc}")
          PY
          else
            echo "Existing detailed CSV is non-empty; no recovery needed."
          fi

      - name: Run MP Tender scraper — full organisation/tender list
        env:
          DETAIL_SAMPLE_SIZE: "0" # [run-scrape-details]
          FETCH_DETAIL_PAGES: "1"
          # Incremental mode: do not reopen already-complete tender detail pages.
          FORCE_DETAIL_REFRESH: "0"
          # 0 = process the full remaining dataset; checkpoint every 10 successes.
          # Full recovery run: rebuild the current organisation/tender snapshot first.
          DETAIL_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          LAST_PUBLISHED_CHECKPOINT=0

          # The scraper writes the main CSV every 10 successful detail records.
          # Publish that checkpoint immediately so the live dashboard can refresh.
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              CHECKPOINT=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path("data/status.json").read_text(encoding="utf-8"))
              print(int(data.get("detail_batch_completed", 0) or 0))
          except Exception:
              print(0)
          PY
              )

              if [ "$CHECKPOINT" -ge 10 ] && [ "$CHECKPOINT" != "$LAST_PUBLISHED_CHECKPOINT" ]; then
                echo "Publishing checkpoint: $CHECKPOINT completed detail records"
                for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
                  if [ -s "$f" ]; then git add "$f"; fi
                done

                if ! git diff --cached --quiet; then
                  git commit -m "Checkpoint tender data $CHECKPOINT [skip ci]"
                  git fetch origin "${GITHUB_REF_NAME}"
                  git rebase "origin/${GITHUB_REF_NAME}" || true
                  git push origin "HEAD:${GITHUB_REF_NAME}" || true
                fi
                LAST_PUBLISHED_CHECKPOINT="$CHECKPOINT"
              fi
            fi
            sleep 10
          done

          # Publish any final partial checkpoint too.
          for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Final tender data checkpoint [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
          wait "$SCRAPER_PID"
      - name: Commit whatever tender data was collected
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No tender data checkpoint to commit."
          else
            git commit -m "Checkpoint collected tender data"
            git push || echo "Checkpoint commit push failed; retained in workspace/logs."
          fi
  monitor_changes:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 3-13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mp-tender-monitor
      cancel-in-progress: true
    steps:
      - name: Check whether this 5-minute tick is a 14-minute/fixed-time slot
        id: gate
        shell: bash
        run: |
          set -e
          now="$(TZ=Asia/Kolkata date '+%H %M')"
          hour="$(echo "$now" | cut -d' ' -f1)"
          minute="$(echo "$now" | cut -d' ' -f2)"
          total=$((10#$hour * 60 + 10#$minute))
          anchor=$((9 * 60))
          exact="false"
          if [[ "$hour:$minute" == "09:00" || "$hour:$minute" == "11:00" || "$hour:$minute" == "13:00" || "$hour:$minute" == "15:00" || "$hour:$minute" == "17:00" || "$hour:$minute" == "19:00" ]]; then
            exact="true"
          fi
          if (( total >= anchor && total <= 19*60 )) && (( (total-anchor) % 14 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$exact" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Check MP Tender changes
        if: steps.gate.outputs.run == 'true'
        env:
          MONITOR_ONLY: "1"
        run: python backend/scraper.py
      - name: Commit monitor changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv
          if git diff --cached --quiet; then
            echo "No monitor data changes."
          else
            git commit -m "Update MP tender monitor data"
            git push
          fi

  evening_new_alert:
    if: github.event_name == 'schedule' && github.event.schedule == '25 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReportLab
        run: pip install reportlab
      - name: Send Telegram New Published alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: evening_new
        run: python backend/telegram_alerts.py

  evening_total_alert:
    if: github.event_name == 'schedule' && github.event.schedule == '30 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReportLab
        run: pip install reportlab
      - name: Send Telegram Total Tenders alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: evening_total
        run: python backend/telegram_alerts.py
  morning_alert:
    if: github.event_name == 'schedule' && github.event.schedule == '50 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReportLab
        run: pip install reportlab
      - name: Send Telegram morning closing-date alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: morning
        run: python backend/telegram_alerts.py
