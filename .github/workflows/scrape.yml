name: MP Tender Daily Scraper

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/scrape.yml"
      - "index.html"
  workflow_dispatch:
  schedule:
    # Daily Tenders-by-Organisation snapshots: 10:35 AM, 1:00 PM, 3:00 PM,
    # 5:00 PM, 6:00 PM and 7:15 PM IST. UTC is used because GitHub schedules are UTC.
    - cron: "5 5 * * *"      # 10:35 AM IST
    - cron: "30 7 * * *"     # 1:00 PM IST
    - cron: "30 9 * * *"     # 3:00 PM IST
    - cron: "30 11 * * *"    # 5:00 PM IST
    - cron: "30 12 * * *"    # 6:00 PM IST
    - cron: "35 13 * * *"    # 7:05 PM IST
    - cron: "25 3 * * *"     # 8:55 AM IST — morning snapshot
    - cron: "35 4 * * *"     # 10:05 AM IST — corrigendum check
    - cron: "35 10 * * *"    # 4:05 PM IST — corrigendum check
    - cron: "15 21 * * *"    # 2:45 AM IST — corrigendum check
    - cron: "*/5 * * * *"    # 5-minute scheduler: random organisation monitor + urgent corrigendum checks

permissions:
  contents: write

jobs:

  rsp_bulk_import:
    # Immediate bulk load of the latest public RSP MP snapshot.
    # Trigger by committing a message containing [run-rsp-import].
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-rsp-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mp-rsp-import
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import latest RSP MP snapshot
        run: |
          python - <<'PY'
          import csv, json, urllib.request
          from pathlib import Path

          RSP_URL = "https://raw.githubusercontent.com/rsparvat/RSPTender/main/data/tenders.json"
          dst = Path("all_tenders_org_detailed.csv")

          with urllib.request.urlopen(RSP_URL, timeout=120) as r:
              data = json.load(r)

          generated = data.get("generated_at", "")
          rsp_rows = [x for x in data.get("tenders", []) if x.get("source") == "MP"]
          print("RSP generated:", generated, "MP rows:", len(rsp_rows))
          if len(rsp_rows) < 5000:
              raise SystemExit("RSP MP snapshot unexpectedly small; refusing to replace dashboard data.")

          existing = []
          if dst.exists():
              with dst.open(encoding="utf-8-sig", newline="") as f:
                  existing = list(csv.DictReader(f))
          old = {str(r.get("Tender ID","")).strip(): dict(r) for r in existing if str(r.get("Tender ID","")).strip()}

          fields = [
            "Tender ID","Published Date","Closing Date","Opening Date","Title","Reference Number",
            "Organisation","Department","Division","Sub Division","PAC Amount","EMD Fee","Tender Fee",
            "Processing Fee","Total Fee","Location","Pincode","Work Description","Product Category",
            "Sub Category","Contract Type","Bid Validity","Pre Qualification Details",
            "Bid Submission Start Date","Bid Submission End Date","Bid Opening Date",
            "Document Download Start Date","Document Download End Date","Fee Payable To","Fee Payable At",
            "Status","Detail Extracted","Corrigendum","Corrigendum Last Checked","Corrigendum Detected At",
            "Corrigendum Type","Corrigendum 15m Checked","Corrigendum 5m Checked","URL","Search Route",
            "Search Result Title","Tested At"
          ]

          def pf(row, key):
              return (row.get("portal_fields") or {}).get(key, "") or ""

          def choose(a, b=""):
              return a if a is not None and str(a) != "" else b

          merged = {}
          for r in rsp_rows:
              tid = str(r.get("tender_id","")).strip()
              if not tid:
                  continue
              prev = old.get(tid, {})
              chain = [x.strip() for x in str(pf(r, "Organisation Chain")).split("||") if x.strip()]
              out = {k: prev.get(k,"") for k in fields}
              out.update({
                "Tender ID": tid,
                "Published Date": choose(r.get("published_date"), prev.get("Published Date","")),
                "Closing Date": choose(r.get("bid_end"), prev.get("Closing Date","")),
                "Opening Date": choose(pf(r,"Bid Opening Date"), prev.get("Opening Date","")),
                "Title": choose(pf(r,"Title"), choose(r.get("work_en"), prev.get("Title",""))),
                "Reference Number": choose(r.get("nit_ref"), choose(pf(r,"Tender Reference Number"), prev.get("Reference Number",""))),
                "Organisation": choose(r.get("organisation"), prev.get("Organisation","")),
                "Department": chain[1] if len(chain)>1 else prev.get("Department",""),
                "Division": chain[2] if len(chain)>2 else prev.get("Division",""),
                "Sub Division": chain[3] if len(chain)>3 else prev.get("Sub Division",""),
                "PAC Amount": choose(r.get("pac"), prev.get("PAC Amount","")),
                "EMD Fee": choose(r.get("emd"), prev.get("EMD Fee","")),
                "Tender Fee": choose(r.get("tender_fee"), prev.get("Tender Fee","")),
                "Processing Fee": choose(r.get("processing_fee"), prev.get("Processing Fee","")),
                "Total Fee": choose(r.get("total_fee"), prev.get("Total Fee","")),
                "Location": choose(r.get("location"), prev.get("Location","")),
                "Pincode": choose(r.get("pincode"), prev.get("Pincode","")),
                "Work Description": choose(pf(r,"Work Description"), choose(r.get("work_en"), prev.get("Work Description",""))),
                "Product Category": choose(pf(r,"Product Category"), prev.get("Product Category","")),
                "Sub Category": choose(pf(r,"Sub category"), prev.get("Sub Category","")),
                "Contract Type": choose(pf(r,"Contract Type"), prev.get("Contract Type","")),
                "Bid Validity": choose(pf(r,"Bid Validity(Days)"), prev.get("Bid Validity","")),
                "Pre Qualification Details": choose(pf(r,"NDA/Pre Qualification"), prev.get("Pre Qualification Details","")),
                "Bid Submission Start Date": choose(pf(r,"Bid Submission Start Date"), prev.get("Bid Submission Start Date","")),
                "Bid Submission End Date": choose(pf(r,"Bid Submission End Date"), choose(r.get("bid_end"), prev.get("Bid Submission End Date",""))),
                "Bid Opening Date": choose(pf(r,"Bid Opening Date"), prev.get("Bid Opening Date","")),
                "Document Download Start Date": choose(pf(r,"Document Download / Sale Start Date"), prev.get("Document Download Start Date","")),
                "Document Download End Date": choose(pf(r,"Document Download / Sale End Date"), prev.get("Document Download End Date","")),
                "Fee Payable To": choose(pf(r,"Fee Payable To"), prev.get("Fee Payable To","")),
                "Fee Payable At": choose(pf(r,"Fee Payable At"), prev.get("Fee Payable At","")),
                "Detail Extracted": "YES" if r.get("detail_fetched") else prev.get("Detail Extracted",""),
                "Corrigendum": "YES" if (r.get("corrigendum_count") or 0) > 0 else prev.get("Corrigendum",""),
                "Corrigendum Last Checked": generated,
                "Corrigendum Detected At": choose(r.get("corrigendum_latest"), prev.get("Corrigendum Detected At","")),
                "URL": choose(r.get("detail_url"), prev.get("URL","")),
                "Search Route": "RSP -> Home -> Organisation -> Live Tender Link -> Detail" if r.get("detail_fetched") else prev.get("Search Route",""),
                "Tested At": choose(r.get("detail_fetched"), prev.get("Tested At",""))
              })
              if not out["Status"]:
                  out["Status"] = "Open"
              merged[tid] = out

          # Preserve any currently known MP rows not in this RSP snapshot so
          # the dashboard never loses live coverage while RSP data is refreshed.
          for tid, row in old.items():
              if tid and tid not in merged:
                  merged[tid] = {k: row.get(k,"") for k in fields}

          with dst.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
              w.writeheader()
              w.writerows(merged.values())

          print("Wrote", len(merged), "rows; RSP MP rows", len(rsp_rows), "snapshot", generated)
          PY
      - name: Commit RSP bulk data
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv
          git commit -m "Load latest RSP MP tender snapshot [skip ci]"
          git push


  manual_detail_test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-detail-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run exact Home Search -> Tender ID -> GO -> Title -> Detail test
        run: |
          set -o pipefail
          python backend/manual_detail_test.py | tee manual_detail_test.log
      - name: Merge successful 5-detail test records into dashboard CSV
        if: success()
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path("manual_detail_test.csv")
          dst=Path("all_tenders_org_detailed.csv")
          if not src.exists():
              raise SystemExit("manual_detail_test.csv not found")
          with src.open(encoding="utf-8-sig", newline="") as f:
              new_rows=list(csv.DictReader(f))
          existing=[]
          if dst.exists():
              with dst.open(encoding="utf-8-sig", newline="") as f:
                  existing=list(csv.DictReader(f))
          by_id={str(r.get("Tender ID","")).strip():dict(r) for r in existing if str(r.get("Tender ID","")).strip()}
          order=list(by_id)
          for r in new_rows:
              tid=str(r.get("Tender ID","")).strip()
              if not tid:
                  continue
              clean={k:r.get(k,"") for k in (existing[0].keys() if existing else r.keys())}
              for k,v in r.items():
                  clean[k]=v
              if tid not in by_id:
                  order.append(tid)
              by_id[tid]=clean
          if not existing:
              fields=list(new_rows[0].keys())
          else:
              fields=list(existing[0].keys())
              for k in new_rows[0].keys():
                  if k not in fields: fields.append(k)
          with dst.open("w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
              w.writeheader()
              for tid in order:
                  w.writerow(by_id[tid])
          print("Merged",len(new_rows),"successful detail records into",dst)
          PY

      - name: Commit test CSV and status
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add manual_detail_test.csv all_tenders_org_detailed.csv data/manual_detail_test_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Save manual tender detail route test results [skip ci]"
            git push || true
          fi


  new_tender_detail_worker:
    # Discovery finishes first; this second job immediately processes only
    # current portal Tender IDs that do not yet have details.
    needs: scrape_full
    if: needs.scrape_full.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout latest discovery snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run new Tender detail worker
        env:
          # Each scheduled snapshot gets a bounded detail batch. This keeps
          # the next organisation snapshot independent of slow detail pages.
          EXISTING_ID_BATCH_SIZE: "500"
          RSP_FAST: "1"
          RSP_FAST_MAX_DETAILS: "500"
          # Normal scheduled mode: do not reopen completed detail pages.
          REPAIR_COMPLETED_DETAILS: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/existing_id_detail.py > new_tender_detail_live.log 2>&1 &
          PID=$!
          LAST=0
          while kill -0 "$PID" 2>/dev/null; do
            if [ -s data/existing_id_detail_status.json ]; then
              COUNT="$(python -c 'import json; print(json.load(open("data/existing_id_detail_status.json")).get("success",0))' 2>/dev/null || echo 0)"
              if [ "$COUNT" -gt "$LAST" ]; then
                git add all_tenders_org_detailed.csv data/existing_id_detail_status.json
                if ! git diff --cached --quiet; then
                  git commit -m "Save new Tender detail checkpoint $COUNT [skip ci]"
                  git push || true
                fi
                LAST="$COUNT"
              fi
            fi
            sleep 5
          done
          wait "$PID"
      - name: Commit final detail data
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv data/existing_id_detail_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete new Tender detail extraction [skip ci]"
            git push || true
          fi
      - name: Show detail worker log
        if: always()
        run: cat new_tender_detail_live.log || true


  detail_recovery_now:
    # One-shot backfill for all copied Tender IDs when [run-all-detail] is explicitly requested. It deliberately
    # shares the list-refresh concurrency group so it waits for the current
    # organisation copy to finish before touching the same CSV.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-detail-now]') || contains(github.event.head_commit.message, '[run-rsp-detail]') || contains(github.event.head_commit.message, '[run-all-detail]') || contains(github.event.head_commit.message, '[run-rsp-fast]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-list-refresh
      cancel-in-progress: true
    steps:
      - name: Checkout latest completed tender-list snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Extract copied Tender IDs pending detail using RSP fast route
        env:
          EXISTING_ID_BATCH_SIZE: "0"
          EXTRACT_ALL_INVENTORY: "1"
          RSP_FAST: "1"
          RSP_FAST_MAX_DETAILS: "6000"
          # One-time full repair: re-open existing detail rows with the
          # corrected fee parser, then continue through all pending IDs.
          REPAIR_COMPLETED_DETAILS: "1"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/existing_id_detail.py > detail_recovery_live.log 2>&1 &
          PID=$!
          LAST=0
          while kill -0 "$PID" 2>/dev/null; do
            if [ -s data/existing_id_detail_status.json ]; then
              COUNT="$(python -c 'import json; print(json.load(open("data/existing_id_detail_status.json")).get("success",0))' 2>/dev/null || echo 0)"
              if [ "$COUNT" -gt "$LAST" ]; then
                git add all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json || true
                if ! git diff --cached --quiet; then
                  git commit -m "Publish detail recovery checkpoint $COUNT [skip ci]"
                  git push || true
                fi
                LAST="$COUNT"
              fi
            fi
            sleep 5
          done
          wait "$PID"
      - name: Commit final recovered detail data
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete Tender detail recovery [skip ci]"
            git push || true
          fi
      - name: Show detail recovery log
        if: always()
        run: cat detail_recovery_live.log || true


  existing_id_detail:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[existing-id-detail]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Extract details using existing Tender IDs only
        env:
          EXISTING_ID_BATCH_SIZE: "20"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/existing_id_detail.py > existing_id_detail_live.log 2>&1 &
          PID=$!
          LAST=0
          while kill -0 "$PID" 2>/dev/null; do
            if [ -s data/existing_id_detail_status.json ]; then
              COUNT="$(python -c 'import json; print(json.load(open("data/existing_id_detail_status.json")).get("success",0))' 2>/dev/null || echo 0)"
              if [ "$COUNT" -gt "$LAST" ]; then
                git add all_tenders_org_detailed.csv data/existing_id_detail_status.json
                if ! git diff --cached --quiet; then
                  git commit -m "Publish existing-ID detail checkpoint $COUNT [skip ci]"
                  git push || true
                fi
                LAST="$COUNT"
              fi
            fi
            sleep 5
          done
          wait "$PID"
      - name: Commit final existing-ID detail data
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv data/existing_id_detail_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete existing Tender ID detail batch [skip ci]"
            git push || true
          fi
      - name: Show existing-ID detail log
        if: always()
        run: cat existing_id_detail_live.log || true


  low_count_detail:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[low-count-detail]') || contains(github.event.head_commit.message, 'tender-count ranges'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Extract low-count ranges sequentially with live checkpoints
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/low_count_detail.py > low_count_detail_live.log 2>&1 &
          SCRAPER_PID=$!
          LAST_SUCCESS=0
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -s data/low_count_detail_status.json ]; then
              SUCCESS="$(python -c 'import json; print(json.load(open("data/low_count_detail_status.json")).get("success",0))' 2>/dev/null || echo 0)"
              RANGE="$(python -c 'import json; print(json.load(open("data/low_count_detail_status.json")).get("current_range",""))' 2>/dev/null || echo "")"
              ORG="$(python -c 'import json; print(json.load(open("data/low_count_detail_status.json")).get("current_organisation",""))' 2>/dev/null || echo "")"
              if [ "$SUCCESS" -gt "$LAST_SUCCESS" ]; then
                echo "LIVE PUBLISH: success=$SUCCESS range=$RANGE org=$ORG"
                git add all_tenders_org_detailed.csv data/low_count_detail_status.json
                if ! git diff --cached --quiet; then
                  git commit -m "Publish live low-count tender detail $SUCCESS [skip ci]"
                  git push || true
                fi
                LAST_SUCCESS="$SUCCESS"
              fi
            fi
            sleep 5
          done
          wait "$SCRAPER_PID"
      - name: Commit final low-count batch
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv data/low_count_detail_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete low-count sequential detail batch [skip ci]"
            git push || true
          fi
      - name: Show low-count batch log
        if: always()
        run: |
          echo "===== low_count_detail_live.log ====="
          cat low_count_detail_live.log || true

  detail_validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate exactly 9 Directorate Sports and Youth Welfare detail pages
        env:
          DETAIL_VALIDATION_ONLY: "1"
          DETAIL_SAMPLE_SIZE: "9"
          DETAIL_ORGANISATION: "Directorate Sports and Youth Welfare"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              git add data/status.json
              git diff --cached --quiet || git commit -m "Update extraction status [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
            sleep 30
          done
          wait "$SCRAPER_PID"
      - name: Commit 9-detail validation data
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add all_tenders_org_detailed.csv detail_validation.csv
          if git diff --cached --quiet; then
            echo "No 9-detail changes to commit."
          else
            git commit -m "Update 9 Directorate Sports detail validation records"
            git push
          fi

  fresh_bootstrap:
    # One-time clean rebuild:
    # each organisation is collected, count-verified (with one retry), and
    # matched organisations immediately send their Tender IDs to detail extraction.
    # Mismatched organisations are not sent to detail until their count matches.
    # The final existing_id_detail worker remains as a retry/backfill pass.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fresh-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-fresh-bootstrap
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Fresh Phase 1 — copy each organisation and extract matched Tender IDs immediately
        env:
          FRESH_BOOTSTRAP: "1"
          FETCH_DETAIL_PAGES: "1"
          NEW_TENDER_ONLY: "1"
          DETAIL_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > fresh_bootstrap_list.log 2>&1 &
          PID=$!
          LAST_ORG=""
          while kill -0 "$PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              ORG="$(python -c 'import json; print(json.load(open("data/status.json")).get("organisation_progress",""))' 2>/dev/null || echo "")"
              if [ -n "$ORG" ] && [ "$ORG" != "$LAST_ORG" ]; then
                for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv data/status.json; do
                  [ -s "$f" ] && git add "$f"
                done
                if ! git diff --cached --quiet; then
                  git commit -m "Fresh organisation snapshot $ORG [skip ci]"
                  git push || true
                fi
                LAST_ORG="$ORG"
              fi
            fi
            sleep 5
          done
          wait "$PID"
      - name: Commit complete fresh list before detail phase
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv data/status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete fresh MP tender list snapshot [skip ci]"
            git push || true
          fi
      - name: Fresh Phase 2 — extract each Tender ID by Home Search route
        env:
          EXISTING_ID_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/existing_id_detail.py > fresh_detail_live.log 2>&1 &
          PID=$!
          LAST_SUCCESS=0
          while kill -0 "$PID" 2>/dev/null; do
            if [ -s data/existing_id_detail_status.json ]; then
              SUCCESS="$(python -c 'import json; print(json.load(open("data/existing_id_detail_status.json")).get("success",0))' 2>/dev/null || echo 0)"
              if [ "$SUCCESS" -gt "$LAST_SUCCESS" ]; then
                git add all_tenders_org_detailed.csv tender_details.csv data/existing_id_detail_status.json || true
                if ! git diff --cached --quiet; then
                  git commit -m "Publish fresh Tender detail $SUCCESS [skip ci]"
                  git push || true
                fi
                LAST_SUCCESS="$SUCCESS"
              fi
            fi
            sleep 5
          done
          wait "$PID"
      - name: Final fresh bootstrap commit
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv tender_details.csv data/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete fresh MP tender inventory and detail extraction [skip ci]"
            git push || true
          fi
      - name: Show fresh bootstrap logs
        if: always()
        run: |
          echo "===== LIST LOG ====="
          cat fresh_bootstrap_list.log || true
          echo "===== DETAIL LOG ====="
          cat fresh_detail_live.log || true

  scrape_full:
    # Organisation snapshot must not wait behind long-running detail extraction.
    # This job only refreshes the live organisation/tender-list copy.
    concurrency:
      group: mp-tender-list-refresh
      cancel-in-progress: false
      queue: max
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '5 5 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 9 * * *' || github.event.schedule == '30 11 * * *' || github.event.schedule == '30 12 * * *' || github.event.schedule == '35 13 * * *')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-scrape-details]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install ReportLab for Telegram PDFs
        run: pip install reportlab
      - name: Install Chromium for full scraper
        run: python -m playwright install --with-deps chromium
      - name: Recover existing Render dataset before extraction
        env:
          RENDER_TENDERS_API: "https://mp-tenders-api.onrender.com/api/tenders"
        run: |
          set -e
          echo "Checking Render for a larger previously-successful dataset; existing data is never discarded."
          python - <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path
          url=os.environ["RENDER_TENDERS_API"]
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload=json.loads(response.read().decode("utf-8"))
              rows=payload.get("tenders", payload if isinstance(payload,list) else [])
              if rows:
                  rows=[r for r in rows if isinstance(r,dict) and str(r.get("Tender ID","")).strip()]
                  existing_ids=set()
                  local=Path("all_tenders_org_detailed.csv")
                  if local.exists():
                      with local.open(encoding="utf-8-sig",newline="") as f:
                          existing_ids={str(r.get("Tender ID","")).strip() for r in csv.DictReader(f) if str(r.get("Tender ID","")).strip()}
                  if len(rows) > len(existing_ids):
                      local_rows=[]
                      local=Path("all_tenders_org_detailed.csv")
                      if local.exists():
                          with local.open(encoding="utf-8-sig",newline="") as f:
                              local_rows=list(csv.DictReader(f))
                      by_id={str(r.get("Tender ID","")).strip():dict(r) for r in local_rows if str(r.get("Tender ID","")).strip()}
                      order=list(by_id)
                      for remote in rows:
                          tid=str(remote.get("Tender ID","")).strip()
                          if not tid:
                              continue
                          if tid not in by_id:
                              by_id[tid]=dict(remote)
                              order.append(tid)
                          else:
                              for k,v in dict(remote).items():
                                  if str(v or "").strip():
                                      by_id[tid][k]=v
                      fields=[]
                      for r in list(by_id.values()):
                          for k in r.keys():
                              if k not in fields:
                                  fields.append(k)
                      with local.open("w",encoding="utf-8",newline="") as f:
                          w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
                          w.writeheader()
                          w.writerows([by_id[k] for k in order])
                      print(f"Merged larger Render dataset: remote={len(rows)}, local_before={len(existing_ids)}, final={len(order)}; no Tender ID was deleted.")
                  else:
                      print(f"Render dataset ({len(rows)}) is not larger than local ({len(existing_ids)}); keeping local data.")
              else:
                  print("Render API returned no tender records; keeping CSV untouched.")
          except Exception as exc:
              print(f"Render API recovery unavailable: {exc}")
          PY

      - name: Commit recovered Render dataset immediately
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          for f in all_tenders_org_detailed.csv organisations.csv organisation_tenders.csv data/status.json; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Recover protected tender dataset from Render [skip ci]"
            git push || echo "Recovery dataset push failed."
          else
            echo "No recovery changes to commit."
          fi

      - name: Run MP Tender scraper — full organisation/tender list
        env:
          DETAIL_SAMPLE_SIZE: "0" # [run-scrape-details]
          FETCH_DETAIL_PAGES: "0"
          COPY_ONLY: "1"
          # Phase 1: collect organisation counts and every tender-list row first.
          # Detail pages are opened only after the complete list snapshot is saved.
          # Incremental mode: do not reopen already-complete tender detail pages.
          FORCE_DETAIL_REFRESH: "0"
          NEW_TENDER_ONLY: "1" # Daily fast mode: existing Tender IDs are discovery-only; detail pages are opened only for new IDs. [run-scrape-details]
          # 0 = process the full remaining dataset; checkpoint every 10 successes.
          # Full recovery run: rebuild the current organisation/tender snapshot first.
          DETAIL_BATCH_SIZE: "0"
        run: |
          set -o pipefail
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/scraper.py > scraper_live.log 2>&1 &
          SCRAPER_PID=$!
          LAST_PUBLISHED_CHECKPOINT=0
          LAST_PUBLISHED_ORG_PROGRESS=""

          # Publish list progress as soon as each organisation is collected.
          # Detail checkpoints still publish every 10 successful detail pages.
          # This prevents the dashboard from remaining empty while detail extraction is slow.
          while kill -0 "$SCRAPER_PID" 2>/dev/null; do
            if [ -f data/status.json ]; then
              read -r CHECKPOINT ORG_PROGRESS < <(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path("data/status.json").read_text(encoding="utf-8"))
              print(int(data.get("detail_batch_completed", 0) or 0), data.get("organisation_progress", ""))
          except Exception:
              print(0, "")
          PY
              )

              SHOULD_PUBLISH="false"
              if [ "$CHECKPOINT" -ge 10 ] && [ "$CHECKPOINT" != "$LAST_PUBLISHED_CHECKPOINT" ]; then
                SHOULD_PUBLISH="true"
              fi
              if [ -n "$ORG_PROGRESS" ] && [ "$ORG_PROGRESS" != "$LAST_PUBLISHED_ORG_PROGRESS" ]; then
                SHOULD_PUBLISH="true"
              fi

              if [ "$SHOULD_PUBLISH" = "true" ]; then
                echo "Publishing live checkpoint: org=$ORG_PROGRESS detail=$CHECKPOINT"
                for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json data/organisation_changes.json data/closing_date_recovery.csv data/live_snapshot.json data/snapshot_recovery_status.json; do
                  if [ -s "$f" ]; then git add "$f"; fi
                done

                if ! git diff --cached --quiet; then
                  git commit -m "Live tender data checkpoint org $ORG_PROGRESS detail $CHECKPOINT [skip ci]"
                  git fetch origin "${GITHUB_REF_NAME}"
                  git rebase "origin/${GITHUB_REF_NAME}" || true
                  git push origin "HEAD:${GITHUB_REF_NAME}" || true
                fi
                LAST_PUBLISHED_CHECKPOINT="$CHECKPOINT"
                LAST_PUBLISHED_ORG_PROGRESS="$ORG_PROGRESS"
              fi
            fi
            sleep 10
          done
          wait "$SCRAPER_PID"

      - name: Show scraper log on Phase 1 failure
        if: failure()
        run: |
          echo "===== scraper_live.log ====="
          cat scraper_live.log || true
          echo "===== data/status.json ====="
          cat data/status.json || true

      # Detail extraction is intentionally NOT run in this job.
      # new_tender_detail_worker starts only after this copy job succeeds.
      - name: Finalize exact portal snapshot with recovery chain
        run: |
          set -e
          set -o pipefail
          python scripts/recover_closing_date_tenders.py > closing_date_recovery.log 2>&1
          python backend/finalize_portal_snapshot.py | tee run_snapshot_finalize.log

      - name: Detail phase handled by separate worker
        run: echo "Detail phase delegated to new_tender_detail_worker." 
      - name: Commit whatever tender data was collected
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          for f in organisations.csv organisation_tenders.csv all_tenders_org_detailed.csv scrape_batch_state.json data/status.json data/organisation_changes.json data/closing_date_recovery.csv data/run_snapshot.json data/run_history.jsonl; do
            if [ -s "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No tender data checkpoint to commit."
          else
            git commit -m "Checkpoint collected tender data"
            git push || echo "Checkpoint commit push failed; retained in workspace/logs."
          fi
  corrigendum_watch:
    if: github.event_name == 'schedule' && (github.event.schedule == '35 4 * * *' || github.event.schedule == '35 10 * * *' || github.event.schedule == '15 15 * * *' || github.event.schedule == '15 21 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: mp-tender-data-writer
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check active + pre-opening corrigendums
        env:
          MONITOR_CORRIGENDUM_ONLY: "1"
        run: python backend/scraper.py
      - name: Commit corrigendum/date/cancellation changes
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          if [ -s all_tenders_org_detailed.csv ]; then
            git add all_tenders_org_detailed.csv
          fi
          if git diff --cached --quiet; then
            echo "No corrigendum changes."
          else
            git commit -m "Update scheduled corrigendum watch [skip ci]"
            git push || echo "Corrigendum checkpoint push failed."
          fi

  corrigendum_urgent:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
