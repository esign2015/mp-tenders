name: Cloudflare API Checks and Deployment
on:
  push:
    branches: [main]
    paths: ["cloudflare/**", ".github/workflows/cloudflare-api.yml"]
  workflow_dispatch:
    inputs:
      database_id:
        description: "Optional existing D1 database ID; otherwise create or reuse mp-tenders-users"
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        working-directory: cloudflare
      - run: npm test && npm run check
        working-directory: cloudflare
      - run: python -m unittest discover -s cloudflare/test -p 'test_migration.py'
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: cloudflare
      - name: Validate Cloudflare account and configure D1 binding
        working-directory: cloudflare
        env:
          DATABASE_ID: ${{ inputs.database_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)throw Error('Connect Cloudflare using GitHub environment secrets before deploying.');
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database`;
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          let id=process.env.DATABASE_ID;
          if(!id){
            const listed=await fetch(endpoint+'?per_page=100',{headers});const databases=await listed.json();
            if(!listed.ok||!databases.success)throw Error('Cloudflare D1 account access failed.');
            const matches=databases.result.filter(db=>db.name==='mp-tenders-users');
            if(matches.length>1)throw Error('Multiple matching databases; specify the exact target ID.');
            if(matches.length)id=matches[0].uuid;
            else{const created=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({name:'mp-tenders-users',primary_location_hint:'apac'})});const data=await created.json();if(!created.ok||!data.success)throw Error('Cloudflare D1 database creation failed.');id=data.result.uuid;}
          }
          if(!/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(id)||id==='00000000-0000-0000-0000-000000000000')throw Error('A real D1 database ID is required.');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.d1_databases[0].database_id=id;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2));
          JS
          npx wrangler whoami
      - name: Apply user schema and deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply mp-tenders-users --remote
          npm run deploy

      - name: Install API secrets without printing their values
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
          TELEGRAM_SESSION_SECRET: ${{ secrets.TELEGRAM_SESSION_SECRET }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const names=['TELEGRAM_BOT_TOKEN','GOOGLE_CLIENT_ID','GITHUB_ACTIONS_TOKEN','TELEGRAM_SESSION_SECRET','ADMIN_SESSION_SECRET','ADMIN_TELEGRAM_IDS'];
          const secrets=Object.fromEntries(names.filter(n=>process.env[n]).map(n=>[n,process.env[n]]));
          for(const name of names.slice(0,3))if(!secrets[name])throw Error(`Missing required environment secret: ${name}`);
          const result=spawnSync('npx',['wrangler','secret','bulk'],{input:JSON.stringify(secrets),stdio:['pipe','inherit','inherit']});
          if(result.status!==0)process.exit(result.status||1);
          JS
