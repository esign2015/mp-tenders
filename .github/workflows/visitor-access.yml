name: Visitor Profile Checks
on:
  push:
    branches: [main]
    paths: ["backend/server.py", "backend/account_access.py", "backend/google_sheet_store.py", "integrations/google-sheets/**", "assets/visitor_access.js", "assets/account_access.js", "index.html", "admin/index.html", "tests/test_accounts.py", "tests/test_account_access.cjs", "tests/test_affidavit_profile.cjs", "tests/test_admin_stats.py", "tests/test_admin_workflow_status.cjs", "tests/test_visitors.py", "tests/test_visitor_access.cjs", "tests/test_google_sheet*", ".github/workflows/visitor-access.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_visitors.py'
      - run: python -m unittest discover -s tests -p 'test_user_export.py'
      - run: python -m unittest discover -s tests -p 'test_google_sheet_store.py'
      - run: python -m unittest discover -s tests -p 'test_accounts.py'
      - run: python -m unittest discover -s tests -p 'test_admin_manual_pdf.py'
      - run: python -m unittest discover -s tests -p 'test_admin_stats.py'
      - run: node tests/test_admin_workflow_status.cjs
      - run: node tests/test_account_access.cjs
      - run: node tests/test_google_sheet_script.cjs
      - run: node tests/test_visitor_access.cjs
      - run: node tests/test_dashboard_sorting.cjs
      - run: node tests/test_dashboard_pdf.cjs
      - run: node tests/test_affidavit_profile.cjs
