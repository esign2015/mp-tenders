name: Apply Telegram and Website PDF Buttons

on:
  push:
    paths:
      - ".github/workflows/apply-ui-buttons.yml"
      - "index.html"
      - "scripts/update_ui_buttons.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update dashboard and PDF buttons
        run: python scripts/update_ui_buttons.py

      - name: Commit and push
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add Get Daily Alert and Website PDF header buttons"
            git push
          fi
