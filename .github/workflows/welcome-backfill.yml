name: Send Existing User Welcome Buttons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/send_welcome_backfill.py', '.github/workflows/welcome-backfill.yml']
permissions:
  contents: read
concurrency:
  group: private-welcome-backfill
  cancel-in-progress: false
jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-existing-welcome]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Send private welcome buttons without exporting contacts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python backend/send_welcome_backfill.py
