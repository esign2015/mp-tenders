name: MP Tender Telegram Alerts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mp-telegram-sender
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pypdf
      - name: Check daily notification rules
        run: |
          python -m unittest discover -s tests -p test_morning_telegram.py -q
          python -m unittest discover -s tests -p test_card_pdf.py -q
      - name: Deliver unsent daily Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backend/scheduled_telegram_delivery.py
      - name: Publish confirmed delivery or retry state
        if: always()
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/publish_data_checkpoint.py data/telegram_schedule.json data/telegram_last_attempt.json data/telegram_delivery/*.json
