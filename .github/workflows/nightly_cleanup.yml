name: MP Tender 7 PM Expired Cleanup

on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mp-tender-cleanup
      cancel-in-progress: false
    steps:
      - name: Checkout latest main data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Purge records whose closing time has passed
        run: python backend/nightly_cleanup.py
      - name: Publish cleanup without overwriting concurrent updates
        env:
          EXPIRED_CLEANUP: "1"
        run: |
          git config user.name "mp-tenders-bot"
          git config user.email "actions@github.com"
          python backend/publish_data_checkpoint.py all_tenders_org_detailed.csv tender_details.csv organisation_tenders.csv data/live_snapshot.json data/cleanup_status.json
